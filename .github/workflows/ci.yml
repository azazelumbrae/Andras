name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Estilo
        run: ruff check andras tests
      - name: Pruebas
        run: pytest -q
