[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andras"
version = "3.0.0a1"
description = "Social engineering attacker with an LLM agent: OSINT, pretexts, reviewable plan, OPSEC"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/azazelumbrae/Andras"

[project.optional-dependencies]
tui = ["textual>=0.70"]
sms = ["twilio>=9.0"]
whatsapp = ["requests>=2.31"]
crypto = ["embit>=0.7"]
socks = ["httpx[socks]>=0.27"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "aiosmtpd>=1.4", "textual>=0.70"]

[project.scripts]
andras = "andras.cli:main"

[tool.setuptools]
packages = ["andras", "andras.store", "andras.brain", "andras.evidence",
            "andras.recon", "andras.artifacts", "andras.delivery", "andras.agent",
            "andras.tui"]

[tool.setuptools.package-data]
andras = ["templates/*.j2", "templates/**/*.j2", "tui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"andras/tools.py" = ["S112"]
"andras/agent/tools.py" = ["S112"]
"andras/cli.py" = ["B008"]
"andras/ops/cli.py" = ["B008"]
