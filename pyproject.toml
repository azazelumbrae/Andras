[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andras"
version = "3.0.0a1"
description = "Emulador de adversario OSINT + ingeniería social para un objetivo humano"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
tui = ["textual>=0.70"]
sms = ["twilio>=9.0"]
whatsapp = ["requests>=2.31"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
andras = "andras.cli:main"

[tool.setuptools]
packages = ["andras", "andras.store", "andras.brain", "andras.evidence",
            "andras.recon", "andras.artifacts", "andras.delivery"]

[tool.setuptools.package-data]
andras = ["templates/*.j2", "templates/**/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"andras/tools.py" = ["S112"]
